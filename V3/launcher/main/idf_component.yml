## IDF Component Manager Configuration
## See: https://docs.espressif.com/projects/idf-component-manager/en/latest/

dependencies:
  # ESP TinyUSB component for USB Mass Storage Device support
  espressif/esp_tinyusb:
    version: "^1.0.0"
    # Patched copy of 1.7.6: SD writes are synchronous, retried and report
    # failures to the PC, and the card is never auto-formatted. See the
    # "BlockBoy patch" comments in tusb_msc_storage.c.
    override_path: "../patches/esp_tinyusb"
    rules:
      - if: "idf_version >=5.0"
  # Pinned to TinyUSB 0.19. With 0.21 (reworked DWC2 DMA receive path) whole
  # 512-byte sectors of files copied in USB mode never reached the SD card:
  # they kept zeros or leftovers of deleted files. Firmware 2.0.1, built with
  # 0.19, never showed this.
  espressif/tinyusb:
    version: "0.19.0~3"
    rules:
      - if: "idf_version >=5.0"
